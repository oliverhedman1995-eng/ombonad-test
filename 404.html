<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sidan finns inte – Webbglans</title>
<style>
@font-face{font-family:N;font-display:swap;src:url(https://oliverhedman1995-eng.github.io/ombonad-test/fonts/Newsreader-normal.woff2) format("woff2")}
@font-face{font-family:N;font-style:italic;font-display:swap;src:url(https://oliverhedman1995-eng.github.io/ombonad-test/fonts/Newsreader-italic.woff2) format("woff2")}
@font-face{font-family:F;font-display:swap;src:url(https://oliverhedman1995-eng.github.io/ombonad-test/fonts/Figtree-normal.woff2) format("woff2")}
:root{--ink:#2C302C;--ink-2:#565C55;--linen:#F4EFE6;--butter:#F3DE95;--sage-d:#455B47;--sage-l:#DCE6D7}
html,body{margin:0;min-height:100%}
body{background:var(--linen);color:var(--ink);font:18px/1.55 F,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;padding:24px;box-sizing:border-box}
.b{position:fixed;border-radius:50%;z-index:-1}
.b1{width:520px;height:520px;background:var(--butter);opacity:.7;right:-160px;top:-180px}
.b2{width:360px;height:360px;background:var(--sage-l);left:-120px;bottom:-160px}
main{max-width:560px}
.k{font:600 13px F,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-d)}
h1{font:500 clamp(44px,9vw,76px)/1.02 N,Georgia,serif;margin:12px 0 18px;letter-spacing:-.02em}
h1 em{color:var(--sage-d)}
p{color:var(--ink-2);margin:0 0 28px}
a.btn{display:inline-flex;align-items:center;gap:10px;background:var(--sage-d);color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px}
a.btn span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--butter);color:var(--sage-d)}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<span class="b b1" aria-hidden="true"></span><span class="b b2" aria-hidden="true"></span>
<main>
<span class="k">Fel 404</span>
<h1>Här blev det <em>matt.</em></h1>
<p>Sidan du letar efter finns inte, eller har flyttat. Startsidan glänser däremot som vanligt.</p>
<a class="btn" id="home" href="/">Till startsidan <span aria-hidden="true">→</span></a>
</main>
<script>if(location.pathname.indexOf('/ombonad-test/')===0)document.getElementById('home').href='/ombonad-test/';</script>
</body>
</html>
